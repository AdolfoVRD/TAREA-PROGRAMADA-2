<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Movimientos</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="center">
        <h1>Movimientos</h1>
    </div>
    <h3>Usuario: <span id="nombreUsuario"></span></h3>

    <button type="button" onclick="window.location.href='menu.html'">Volver al menú</button>
    <br><br>

    <output id="mensaje"></output>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>Fecha de la accion</th>
                <th>Monto</th>
                <th>Tipo</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody id="tablaMovimientos"></tbody>
    </table>
    <script src="script.js"></script>
    <script>

        function cargarMovimientos(usuario) {
            mensaje.textContent = "";
            tablaMovimientos.innerHTML = "";
            fetch(`${API_URL}/Movimientos/${usuario}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ idUsuario: usuario })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(movimientos => {
                    movimientos.forEach(movimiento => {
                        const fila = document.createElement("tr");
                        fila.style.cursor = "pointer";
                        fila.innerHTML = `
                            <td>${movimiento.fechaAccion}</td>
                            <td>${movimiento.monto}</td>
                            <td>${movimiento.tipo}</td>
                            <td>${movimiento.descripcion}</td>`;
                        fila.addEventListener("click", () => {
                           
                        });
                        tablaMovimientos.appendChild(fila);
                    });
                })
                .catch(() => {
                    mensaje.textContent = "No se pudo cargar los movimientos.";
                });
        }

        window.onload = () => {
            const usuarioGuardado = sessionStorage.getItem("usuario");
            const usuarioId = sessionStorage.getItem("idUsuario")
            if (!usuarioGuardado) {
                
                window.location.href = "index.html";
                return;
            }

            CargarMenu()
            cargarMovimientos(usuarioId) //Cargar los movimientos del usuario al cargar la página
           
        };
    </script>
</body>
</html>
