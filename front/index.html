<!DOCTYPE html>
<html lang="es">
<head>
    <title>Login</title>
</head> 
<body class="body">
<div class="login">
    <div class="form">
        <form onsubmit="iniciarSesion(event)">
            <h3>Iniciar Sesión</h3>
            <label for="inputUsuario">Usuario</label>
            <input type="text" id="inputUsuario" autocomplete="username" required/>
            <label for="inputContraseña">Contraseña</label>
            <input type="password" id="inputContraseña" autocomplete="current-password" required/>
            <br>
            <br>
            <button type="submit" id="inicioSesion">Iniciar Sesión</button>
            
            <output id="mensaje" aria-live="polite"></output>
        </form>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
