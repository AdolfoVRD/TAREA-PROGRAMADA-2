<!DOCTYPE HTML>
<html lang="en" >
<html>
<head>
    <title>Menu</title>
    
    <style> 
    </style>
</head> 
<body class="body">	
<div class="menu">
    <div>
        <h3 background="lightgray">Menu</h3>
        <br>
        <h3>Usuario: <span id="nombreUsuario"></span></h3>
        <button type="button" onclick="window.location.href='estados.html'">Consultar Estados de cuenta</button>
        <button type="button" onclick="window.location.href='index.html'">Cerrar Sesión</button>
        <br>
        <output id="mensaje"> </output>
        
</div>
</div>
<script src="script.js"></script>
<script>
    window.onload = function() {
        CargarMenu();
        fetch("http://localhost:5000/usuario")
            .then(response => {
                if (!response.ok) {
                    window.location.href = "index.html";
                    return null;
                }
                return response.json();
            })
            .then(data => {
                if (data) {
                    document.getElementById("nombreUsuario").textContent = data.usuario;
                }
            })
            .catch(() => {
                document.getElementById("mensaje").textContent = "No se pudo conectar con el servidor.";
            });
    };
</script>
</body>
</html>
