<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bitácora</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="center">
        <h1>Bitácora</h1>
    </div>
    <h3>Usuario: <span id="nombreUsuario"></span></h3>

    <button type="button" onclick="window.location.href='menu.html'">Volver al menú</button>
    <br><br>

    <output id="mensaje"></output>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>Fecha de la accion</th>
                <th>Id de operacion</th>
                <th>Operacion</th>
            </tr>
        </thead>
        <tbody id="tablaBitacora"></tbody>
    </table>
    <script src="script.js"></script>
    <script>

        function cargarBitacora(usuario) {
            mensaje.textContent = "";
            tablaBitacora.innerHTML = "";
            fetch(`${API_URL}/bitacora/${usuario}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ idUsuario: usuario })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(bitacora => {
                    bitacora.forEach(bitacora => {
                        const fila = document.createElement("tr");
                        fila.style.cursor = "pointer";
                        fila.innerHTML = `
                            <td>${bitacora.fechaAccion}</td>
                            <td>${bitacora.idOperacion}</td>
                            <td>${bitacora.nombreAccion}</td>`;
                        fila.addEventListener("click", () => {
                            // En la TP3 aquí se mostrarán los movimientos del mes
                        });
                        tablaBitacora.appendChild(fila);
                    });
                })
                .catch(() => {
                    mensaje.textContent = "No se pudo cargar la bitacora.";
                });
        }

        window.onload = () => {
            const usuarioGuardado = sessionStorage.getItem("usuario");
            const usuarioId = sessionStorage.getItem("idUsuario")
            if (!usuarioGuardado) {
                
                window.location.href = "index.html";
                return;
            }

            CargarMenu()
            cargarBitacora(usuarioId)
           
        };
    </script>
</body>
</html>
